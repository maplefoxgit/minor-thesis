name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: make install

      - name: Run bounded pipeline
        run: make run-all

      - name: Check repository hygiene
        shell: bash
        run: |
          ! git ls-files | grep -E '(^\.venv/|__pycache__|\.pyc$|\.pytest_cache|\.egg-info)'
          ! grep -R "/Users/" README.md docs results policies
